# Notificaciones push gratis: GitHub ejecuta esto cada 10 minutos.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT y la variable APP_URL (GUIA.md, paso 6).
name: Avisos de multas

on:
  schedule:
    - cron: "*/10 * * * *"   # multas nuevas, cada 10 minutos
    - cron: "0 16 * * 5"     # viernes a las 17:00 (invierno) / 18:00 (verano), hora de España
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # para que GitHub no apague la tarea tras 60 días sin cambios

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Multas nuevas
        if: github.event.schedule != '0 16 * * 5'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/avisos.py multas
      - name: Recordatorio del viernes
        if: github.event.schedule == '0 16 * * 5'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/avisos.py viernes
      - name: Mantener la tarea activa
        if: github.event.schedule == '0 16 * * 5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/avisos.yml/enable" || true
